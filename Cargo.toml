[package]
name = "reinstall-kit"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Backup kit for reinstalling Windows"
repository = "https://github.com/ValenokMC/reinstall-kit"

[[bin]]
name = "ReinstallKit"
path = "src/main.rs"

# Development helper: writes the icon and version information into the built exe.
[[bin]]
name = "stamp"
path = "src/bin/stamp.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
winreg = "0.52"
rfd = { version = "0.15", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
